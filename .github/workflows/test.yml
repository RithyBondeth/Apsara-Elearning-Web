name: test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strict, reproducible install. The former next-intl/@swc/helpers peer
      # conflict that once forced `npm install` here is resolved by the
      # "@swc/helpers" override in package.json.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Catches build-only failures (server/client boundaries, route config)
      # before Vercel does. Needs no env: pages read the API at request time.
      - run: npm run build
