name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strict, reproducible install. The former next-intl/@swc/helpers peer
      # conflict that once forced `npm install` here is resolved by the
      # "@swc/helpers" override in package.json.
      - run: npm ci
      - run: npm test
